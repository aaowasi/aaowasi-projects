name: Validate and synchronize public site
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build_site.py
      - run: python scripts/check_site.py
      - run: python scripts/check_contract.py
      - run: node --check site/assets/site.js
      - run: node --check site/assets/outcomes.mjs
      - run: node --check site/assets/scenario-ui.mjs
      - run: node --check site/assets/dashboard-core.mjs
      - run: node --check site/assets/dashboard-ui.mjs
      - run: node --check site/assets/control-center.mjs
      - run: node --check site/assets/suite.mjs
      - run: node --test tests/browser/*.test.mjs
      - name: Synchronize generated public site
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- site README.md DOCS.md docs-sync.json; then
            echo "Generated site is already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site README.md DOCS.md docs-sync.json
            git commit -m "chore: synchronize generated public site"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
