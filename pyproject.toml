[project]
name = "grc-ai-governance-engine"
version = "2.0.0"
description = "Adaptive, evidence-led GRC and AI assurance reference engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
documents = ["pypdf>=6,<7"]
dev = ["pytest>=8,<9"]

[project.scripts]
grc-engine = "engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
